          },
          {
            "@type": "Question",

              "@type": "Answer",
              "text": "Trợ lý học tập thông minh của app: Gemini lo giải thích và ngữ pháp, Whisper lo nghe chép bài nói."
            }
          },
          {
            "@type": "Question",
            "name": "Đăng ký có cần thẻ ngân hàng không?",

          },

            }
          }
        ]
      }
    ]
